<div class="fsd-generator-container">
  <div class="top-bar">
    <h1>FSD Generator</h1>
    <button
      pButton
      label="Browse FSDs"
      icon="pi pi-folder-open"
      class="p-button-secondary"
      (click)="goToBrowser()"
    ></button>
  </div>
  <!-- Header Input -->
  <div class="input-group">
    <input
      type="text"
      pInputText
      [(ngModel)]="functionName"
      placeholder="Enter Function Name"
      (keyup.enter)="onFetchJira()"
    />
    <button
      pButton
      icon="pi pi-search"
      label="Fetch JIRAs"
      (click)="onFetchJira()"
    ></button>
  </div>

  <!-- JIRA Table -->
  <p-table
    [value]="jiraList"
    [paginator]="true"
    [rows]="5"
    [filterDelay]="300"
    [responsiveLayout]="'scroll'"
  >

    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Summary</th>
        <th>Action</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-jira>
      <tr>
        <td>{{ jira.id }}</td>
        <td>{{ jira.summary }}</td>
        <td>
          <button
            pButton
            icon="pi pi-trash"
            class="p-button-danger p-button-sm"
            (click)="removeJira(jira)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Generate Button -->
  <div class="action-bar">
    <button pButton label="Generate FSD" icon="pi pi-cog" (click)="generateFsd()" [disabled]="jiraList.length === 0"></button>
  </div>

  <!-- FSD Markdown -->
  <div *ngIf="generatedFsd" class="fsd-output">
    <div class="fsd-header">
      <h2>Generated FSD</h2>
      <button pButton label="Save as PDF" icon="pi pi-download" (click)="saveAsMarkdown()"></button>
    </div>
    <div id="fsd-markdown" class="markdown-wrapper">
      <markdown [data]="generatedFsd"></markdown>
    </div>
  </div>
</div>
